[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lenovo-dmi-rescue"
version = "0.1.0"
description = "Recover Lenovo DMI (MTM / serial / UUID / OA3) after a bad BIOS flash"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emilelu" }]
keywords = [
    "lenovo",
    "bios",
    "dmi",
    "smbios",
    "lenv",
    "insyde",
    "insydeh2o",
    "spi",
    "ch341a",
    "recovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dmi-rescue = "lenovo_dmi_rescue.cli:main"

[project.urls]
Homepage = "https://github.com/Emilelu/lenovo-dmi-rescue"
Issues = "https://github.com/Emilelu/lenovo-dmi-rescue/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
